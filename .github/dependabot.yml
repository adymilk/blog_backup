version: 2
updates:
  # ---------------------------------------------------------------------------
  # 根项目依赖
  # ---------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: "/"
    schedule:
      # 原来是 daily。对这样一个长期低维护的个人站，
      # 每天检查会产生大量破坏性升级 PR，反而淹没真正重要的安全更新。
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # minor 和 patch 合并成一个 PR，减少噪音
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    # 主版本升级（如 hexo-renderer-marked 4→7）往往是破坏性的，
    # 对个人站不划算 —— 忽略掉，需要时手动升。
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  # ---------------------------------------------------------------------------
  # GitHub Actions（我们自己的 workflow）
  # ---------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
