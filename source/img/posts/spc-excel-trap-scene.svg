<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2B5B84"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#9CA3AF"/>
    </marker>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
      .title { font-size: 20px; font-weight: 700; fill: #111827; }
      .sub { font-size: 13px; fill: #4B5563; }
      .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; fill: #2B5B84; }
      .card-t { font-size: 14px; font-weight: 700; fill: #111827; }
      .card-b { font-size: 12px; fill: #4B5563; }
      .tag { font-size: 11px; font-weight: 600; fill: #2B5B84; }
      .warn-t { font-size: 13px; font-weight: 700; fill: #991B1B; }
      .warn-b { font-size: 11.5px; fill: #7F1D1D; }
    </style>
  </defs>

  <rect width="960" height="540" fill="#FAFAFA"/>
  <rect x="24" y="24" width="912" height="492" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.2"/>

  <text x="52" y="62" class="font eyebrow">INDUSTRY REALITY · 制造业常见断层场景</text>
  <text x="52" y="90" class="font title">为什么买了 SPC / MSA 系统后，质量现场依然退回 Excel？</text>
  <text x="52" y="112" class="font sub">核心矛盾：系统只接管了“画图与计算”，却没有接管“数据来源”和“异常处置闭环”</text>

  <!-- Row 1: Reality / Shadow Excel Workflow -->
  <text x="52" y="148" class="font tag">现实中真正跑起来的「影子 Excel 链路」</text>

  <rect x="52" y="162" width="186" height="104" rx="8" fill="#F9FAFB" stroke="#D1D5DB"/>
  <text x="70" y="188" class="font card-t">1. 产线与实验室现场</text>
  <text x="70" y="210" class="font card-b">三坐标 / 卡尺 / 检具 / PLC</text>
  <text x="70" y="229" class="font card-b">数据散落在工控机 TXT、</text>
  <text x="70" y="248" class="font card-b">MES 视图与纸质巡检表</text>

  <line x1="238" y1="214" x2="274" y2="214" stroke="#2B5B84" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="280" y="162" width="194" height="104" rx="8" fill="#FEF2F2" stroke="#FECACA"/>
  <text x="298" y="188" class="font warn-t">2. 人工搬运与二次加工</text>
  <text x="298" y="210" class="font warn-b">U 盘拷贝 / 导出 CSV</text>
  <text x="298" y="229" class="font warn-b">手工删空行、改字段、</text>
  <text x="298" y="248" class="font warn-b">在 Excel 中拼接批次与工单</text>

  <line x1="474" y1="214" x2="510" y2="214" stroke="#2B5B84" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="516" y="162" width="186" height="104" rx="8" fill="#FEF2F2" stroke="#FECACA"/>
  <text x="534" y="188" class="font warn-t">3. 事后离线出图交差</text>
  <text x="534" y="210" class="font warn-b">周末或客户审厂前集中补录</text>
  <text x="534" y="229" class="font warn-b">用 Excel 模板或桌面软件</text>
  <text x="534" y="248" class="font warn-b">批量导出 Cpk / GR&amp;R 报告</text>

  <line x1="702" y1="214" x2="738" y2="214" stroke="#2B5B84" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="744" y="162" width="164" height="104" rx="8" fill="#F9FAFB" stroke="#D1D5DB"/>
  <text x="762" y="188" class="font card-t">4. 审计存档结束</text>
  <text x="762" y="210" class="font card-b">异常发生时产线不知情</text>
  <text x="762" y="229" class="font card-b">批量报废后才看到超限</text>
  <text x="762" y="248" class="font card-b">统计变成事后合规成本</text>

  <!-- Divider -->
  <line x1="52" y1="296" x2="908" y2="296" stroke="#E5E7EB" stroke-dasharray="5 5"/>

  <!-- Row 2: Idle SPC System & 3 Root Breaks -->
  <text x="52" y="326" class="font tag">被边缘化的「单点 SPC / MSA 系统」与三大结构断层</text>

  <rect x="52" y="342" width="270" height="142" rx="8" fill="#EEF4F9" stroke="#B6CFE4"/>
  <text x="72" y="370" class="font card-t">断层一：数据接入断层</text>
  <text x="72" y="394" class="font card-b">• 缺乏多源异构数据自动采集与清洗</text>
  <text x="72" y="416" class="font card-b">• 质量特性与 MES 工单/机台/批次脱节</text>
  <text x="72" y="438" class="font card-b">• 工程师录入成本高于直接用 Excel</text>
  <text x="72" y="464" class="font tag">→ 系统沦为“二次手工录入壳”</text>

  <rect x="345" y="342" width="270" height="142" rx="8" fill="#EEF4F9" stroke="#B6CFE4"/>
  <text x="365" y="370" class="font card-t">断层二：分析与现场断层</text>
  <text x="365" y="394" class="font card-b">• 只算统计值，未先验校验测量系统 MSA</text>
  <text x="365" y="416" class="font card-b">• 判异规则配置僵化，误报/漏报频发</text>
  <text x="365" y="438" class="font card-b">• 产线看板看不到，质量部事后才复盘</text>
  <text x="365" y="464" class="font tag">→ 控制图失去实时过程预警价值</text>

  <rect x="638" y="342" width="270" height="142" rx="8" fill="#EEF4F9" stroke="#B6CFE4"/>
  <text x="658" y="370" class="font card-t">断层三：异常处置闭环断层</text>
  <text x="658" y="394" class="font card-b">• 触发超限后没有 OCAP 行动指引</text>
  <text x="658" y="416" class="font card-b">• 告警止步于弹窗，未联动停机/派单</text>
  <text x="658" y="438" class="font card-b">• 根因与措施未回写，经验无法沉淀</text>
  <text x="658" y="464" class="font tag">→ 发现问题却无法驱动现场改进</text>
</svg>
