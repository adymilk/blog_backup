<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'PingFang SC', sans-serif">
  <rect width="1200" height="675" fill="#FAFAFA"/>
  <rect x="32" y="32" width="1136" height="611" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>

  <text x="68" y="88" font-size="13" font-weight="700" fill="#2B5B84" letter-spacing="2">ARCHITECTURE · DUAL-LAYER DECISION LOOP</text>
  <text x="68" y="126" font-size="28" font-weight="800" fill="#111827">工业软件双层决策闭环：概率推理层 × 确定性计算引擎</text>
  <line x1="68" y1="150" x2="1132" y2="150" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Top Layer: Probabilistic AI Agent Layer -->
  <rect x="68" y="178" width="900" height="175" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="92" y="210" font-size="15" font-weight="700" fill="#2B5B84">概率推理层 · Probabilistic AI Agent Layer（理解意图、检索知识、解释结论）</text>

  <rect x="92" y="232" width="240" height="96" rx="6" fill="#FFFFFF" stroke="#111827" stroke-width="1.5"/>
  <text x="212" y="272" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">1. 意图与上下文解析</text>
  <text x="212" y="298" text-anchor="middle" font-size="13" fill="#6B7280">产线 / 工序 / 时间窗 / 指标</text>

  <path d="M332 280 L382 280" stroke="#111827" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="386" y="232" width="250" height="96" rx="6" fill="#FFFFFF" stroke="#111827" stroke-width="1.5"/>
  <text x="511" y="272" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">2. RAG 质量知识检索</text>
  <text x="511" y="298" text-anchor="middle" font-size="13" fill="#6B7280">SOP 规范 · 历史异常复盘</text>

  <path d="M636 280 L686 280" stroke="#111827" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="690" y="232" width="250" height="96" rx="6" fill="#FFFFFF" stroke="#2B5B84" stroke-width="2"/>
  <text x="815" y="272" text-anchor="middle" font-size="16" font-weight="700" fill="#2B5B84">3. 归因与行动建议</text>
  <text x="815" y="298" text-anchor="middle" font-size="13" fill="#6B7280">结构化排查路径 + 溯源引用</text>

  <!-- Down Arrow -->
  <path d="M212 328 L212 426" stroke="#2B5B84" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <rect x="224" y="366" width="176" height="28" rx="4" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="312" y="385" text-anchor="middle" font-size="12" font-weight="600" fill="#2B5B84">Typed Schema 参数调用</text>

  <!-- Bottom Layer: Deterministic Industrial Engine -->
  <rect x="68" y="408" width="900" height="175" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="92" y="440" font-size="15" font-weight="700" fill="#111827">确定性工业引擎层 · Deterministic Engine（严禁幻觉，结果 100% 可复现）</text>

  <rect x="92" y="462" width="240" height="96" rx="6" fill="#FFFFFF" stroke="#111827" stroke-width="1.5"/>
  <text x="212" y="502" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">MES / QMS 数据底座</text>
  <text x="212" y="528" text-anchor="middle" font-size="13" fill="#6B7280">ETL 清洗 · 权限隔离视图</text>

  <path d="M332 510 L382 510" stroke="#111827" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="386" y="462" width="250" height="96" rx="6" fill="#2B5B84"/>
  <text x="511" y="502" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">SPC / MSA 统计引擎</text>
  <text x="511" y="528" text-anchor="middle" font-size="13" fill="#DBEAFE">Xbar-R · Cpk/Ppk · 判异规则</text>

  <path d="M636 510 L686 510" stroke="#111827" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="690" y="462" width="250" height="96" rx="6" fill="#FFFFFF" stroke="#111827" stroke-width="1.5"/>
  <text x="815" y="502" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">审计日志与数值校验</text>
  <text x="815" y="528" text-anchor="middle" font-size="13" fill="#6B7280">可追溯计算流水与基线比对</text>

  <!-- Feedback Loop on Right -->
  <path d="M940 510 L1055 510 L1055 280 L946 280" fill="none" stroke="#2B5B84" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <rect x="985" y="366" width="140" height="54" rx="6" fill="#2B5B84"/>
  <text x="1055" y="389" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">可验证决策闭环</text>
  <text x="1055" y="408" text-anchor="middle" font-size="11" fill="#DBEAFE">Verified Decision</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#111827"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2B5B84"/>
    </marker>
  </defs>
</svg>
