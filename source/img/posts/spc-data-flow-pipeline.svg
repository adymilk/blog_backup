<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2B5B84"/>
    </marker>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
      .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; fill: #2B5B84; }
      .title { font-size: 20px; font-weight: 700; fill: #111827; }
      .sub { font-size: 12.5px; fill: #4B5563; }
      .step-num { font-size: 11px; font-weight: 700; fill: #2B5B84; }
      .step-t { font-size: 13.5px; font-weight: 700; fill: #111827; }
      .step-b { font-size: 11.5px; fill: #4B5563; }
      .badge { font-size: 11px; font-weight: 600; fill: #1E4363; }
    </style>
  </defs>

  <rect width="960" height="540" fill="#FAFAFA"/>
  <rect x="24" y="24" width="912" height="492" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.2"/>

  <text x="52" y="60" class="font eyebrow">END-TO-END DATA PIPELINE · 测量数据与异常闭环流转</text>
  <text x="52" y="88" class="font title">一条产线测量数据如何从采集走向真正的异常闭环？</text>
  <text x="52" y="110" class="font sub">数据只有附带 5M1E 上下文并驱动 OCAP 处置回写，SPC 才能真正替代离线 Excel</text>

  <!-- Step 1 -->
  <rect x="52" y="140" width="260" height="126" rx="8" fill="#F9FAFB" stroke="#D1D5DB"/>
  <text x="70" y="164" class="font step-num">STEP 01 · 自动接入与校验</text>
  <text x="70" y="186" class="font step-t">多源数据采集 + 检具准入校验</text>
  <text x="70" y="208" class="font step-b">• CMM/MES/串口数据实时推入网关</text>
  <text x="70" y="227" class="font step-b">• 自动核对检具 MSA 有效期与 GR&amp;R</text>
  <text x="70" y="246" class="font step-b">• 缺失/乱码报文进入隔离区告警</text>

  <line x1="312" y1="203" x2="346" y2="203" stroke="#2B5B84" stroke-width="1.8" marker-end="url(#arr2)"/>

  <!-- Step 2 -->
  <rect x="350" y="140" width="260" height="126" rx="8" fill="#EEF4F9" stroke="#B6CFE4"/>
  <text x="368" y="164" class="font step-num">STEP 02 · 标准化建模</text>
  <text x="368" y="186" class="font step-t">统一测量事件 + 5M1E 关联</text>
  <text x="368" y="208" class="font step-b">• 统一单位、精度、采样时间与子组号</text>
  <text x="368" y="227" class="font step-b">• 绑定产线 / 机台 / 模具 / 批次 / 人员</text>
  <text x="368" y="246" class="font step-b">• 写入标准事件表并更新 Redis 滑窗</text>

  <line x1="610" y1="203" x2="644" y2="203" stroke="#2B5B84" stroke-width="1.8" marker-end="url(#arr2)"/>

  <!-- Step 3 -->
  <rect x="648" y="140" width="260" height="126" rx="8" fill="#EEF4F9" stroke="#B6CFE4"/>
  <text x="666" y="164" class="font step-num">STEP 03 · 实时计算与判异</text>
  <text x="666" y="186" class="font step-t">控制图引擎 + Nelson 规则检测</text>
  <text x="666" y="208" class="font step-b">• 实时计算均值、极差、控制限与 Cpk</text>
  <text x="666" y="227" class="font step-b">• 区分“仅超控制限”与“趋势漂移”</text>
  <text x="666" y="246" class="font step-b">• 按产线分级策略触发看板/消息预警</text>

  <!-- Down arrow from Step 3 to Step 4 -->
  <line x1="778" y1="266" x2="778" y2="306" stroke="#2B5B84" stroke-width="1.8" marker-end="url(#arr2)"/>

  <!-- Step 4 (Right Bottom) -->
  <rect x="648" y="312" width="260" height="130" rx="8" fill="#FFFFFF" stroke="#2B5B84" stroke-width="1.5"/>
  <text x="666" y="336" class="font step-num">STEP 04 · 异常处置（OCAP）</text>
  <text x="666" y="358" class="font step-t">分级派单与现场遏制动作</text>
  <text x="666" y="380" class="font step-b">• 自动生成异常单并推送责任工程师</text>
  <text x="666" y="399" class="font step-b">• 按 OCAP 预案执行隔离/调机/复检</text>
  <text x="666" y="418" class="font step-b">• 记录响应时长与遏制状态防漏处理</text>

  <line x1="648" y1="377" x2="614" y2="377" stroke="#2B5B84" stroke-width="1.8" marker-end="url(#arr2)"/>

  <!-- Step 5 (Center Bottom) -->
  <rect x="350" y="312" width="260" height="130" rx="8" fill="#F9FAFB" stroke="#D1D5DB"/>
  <text x="368" y="336" class="font step-num">STEP 05 · 根因回写与复核</text>
  <text x="368" y="358" class="font step-t">控制图注释沉淀与效果验证</text>
  <text x="368" y="380" class="font step-b">• 根因类别（人机料法环测）结构化回写</text>
  <text x="368" y="399" class="font step-b">• 控制图异常点自动挂接处置注释</text>
  <text x="368" y="418" class="font step-b">• 观察后续子组是否恢复受控状态</text>

  <line x1="350" y1="377" x2="316" y2="377" stroke="#2B5B84" stroke-width="1.8" marker-end="url(#arr2)"/>

  <!-- Step 6 (Left Bottom) -->
  <rect x="52" y="312" width="260" height="130" rx="8" fill="#F3F6F9" stroke="#B6CFE4"/>
  <text x="70" y="336" class="font step-num">STEP 06 · 持续改进与审计</text>
  <text x="70" y="358" class="font step-t">过程能力复盘与知识库沉淀</text>
  <text x="70" y="380" class="font step-b">• 自动汇总跨批次 Ppk / 异常帕累托图</text>
  <text x="70" y="399" class="font step-b">• 一键生成客户审厂级可追溯证据链</text>
  <text x="70" y="418" class="font step-b">• 为后续 AI 根因检索积累高质量语料</text>

  <!-- Feedback Loop Line -->
  <path d="M 182 442 L 182 480 L 480 480" fill="none" stroke="#2B5B84" stroke-width="1.3" stroke-dasharray="4 4"/>
  <text x="492" y="484" class="font badge">反馈闭环：高频异常反向优化控制计划（Control Plan）与采样频率</text>
</svg>
