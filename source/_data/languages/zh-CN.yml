# =============================================================================
# 站点级主题 i18n 覆盖
#
# 这个文件由 themes/hexo-theme-stun/scripts/merge-config.js 读取，merge 进主题
# 自身的 languages/zh-CN.yml。只需写「和主题默认值不同」的键，其余自动继承。
#
# ⚠️ 不要在这里复制主题的完整 i18n —— 主题升级时会失同步。
# =============================================================================

menu:
  # 导航显示「技术笔记」，但 URL 仍是 /archives/（key 保持 archives 不变，
  # 因为 sidebar.pug:91 依赖 theme.menu.archives 来渲染站点统计块）
  archives: 技术笔记
  works: 作品与证据
  resume: 简历

# 侧边栏统计块（sidebar.pug:95）的标签。分类/标签页已从导航摘除，
# 这里只展示文章总数。
sidebar:
  archives: 文章
