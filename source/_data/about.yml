projects:
  title: From Ideas to Impact.
  items:
    - name: 工业 SPC / MSA 软件产品与实时监控
      type: 工业 SPC / MSA 产品
      background: 面向制造企业质量工程与过程控制需求，推动统计分析从离线桌面走向产线实时协同。
      problem: 传统离线分析反馈滞后，一线质量人员难以实时捕捉制程趋势波动。
      role: 产品规划、二次开发架构设计与端到端交付落地。
      outcome: "[可编辑占位：例如 形成可演示的实时监控链路，缩短异常响应周期]"
      link: /projects/realtime-spc-control-chart/
    - name: 工业数据分析平台与引擎桥接
      type: 工业数据分析平台
      background: 企业级质量管理平台需要统一调用专业统计分析内核，生成标准化控制图与分析报告。
      problem: 桌面级统计软件 COM 接口无法被 Web 服务端直接并发调用，存在阻塞与稳定性隐患。
      role: 核心桥接服务架构设计、异步任务状态机实现与工程交付。
      outcome: "[可编辑占位：例如 打通 Web 平台与专业统计引擎的自动化交付链路]"
      link: /projects/minitab-com-bridge/
    - name: 企业多源数据集成与 ETL 架构
      type: 数据集成与 ETL 架构
      background: 制造现场并存 MES、LIMS、设备日志与离线台账，制约上层数据分析与 AI 应用。
      problem: 数据孤岛严重、口径不统一且存在脏数据，导致分析结果失真。
      role: 数据架构设计、清洗校验规则制定与自动化同步方案规划。
      outcome: "[可编辑占位：例如 沉淀标准化 Analysis-Ready 数据底座方案]"
      link: /projects/enterprise-etl-integration/
    - name: 企业 AI Agent 应用与知识工作流
      type: 企业 AI Agent 应用
      background: 探索大模型、RAG 企业知识库与 MCP 工具链在工业质量分析与业务决策中的企业级应用。
      problem: 通用大模型在专业工业场景存在幻觉风险，且缺乏客观的上线评测标准。
      role: AI Agent 工作流设计、确定性工具封装与 Golden Set 评测体系构建。
      outcome: "[可编辑占位：例如 构建可回归评测的企业级 AI 原型架构]"
      link: /projects/industrial-ai-agent-platform/
    - name: AI 与传统产业结合的创新产品探索
      type: 创新产品实践
      background: 围绕传统制造业与企业服务场景，持续验证高 ROI 的智能化切入点与商业化模式。
      problem: 许多技术方案脱离产线实际预算与操作习惯，难以实现商业闭环。
      role: 客户需求调研、产品定义、方案宣讲与商业化路径验证。
      outcome: "[可编辑占位：持续探索与行业共创中]"
      link: /projects/

