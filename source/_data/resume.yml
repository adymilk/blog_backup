    - Contributed to industrial quality analytics platforms and enterprise data infrastructure, serving approx. 40 clients across approx. 50 projects while translating technical capability into product and commercial value.

summary:
  title_en: Professional Summary
  title_zh: 专业能力概要
  paragraphs:
    - 从一线软件开发工程师起步，逐步成长为兼具企业级系统架构设计、5人研发团队管理、工业软件产品规划、制造业数字化解决方案与售前交付经验的复合型产品与技术负责人。
    - 长期深耕制造业质量管理与工业数据分析场景，熟悉 SPC、MSA、过程能力分析等专业业务，推动 Minitab 统计分析算法与现代 Web/Python 工程体系融合，参与打造 BSA（Brumano Smart Analytics）系列产品及企业数据集成平台规划。
    - 既能把控 B/S 架构、数据库、接口集成与部署体系的工程落地，也能直接面向客户开展需求调研、产品演示、技术方案汇报与项目交付，协同研发、产品、销售与实施团队推动产品商业化与客户持续合作。
  paragraphs_en:
    - Progressed from hands-on software developer to a multidisciplinary product and technology lead combining enterprise systems architecture, 5-person R&D team management, industrial software product planning, manufacturing digitalization solutions, and pre-sales/delivery execution.
    - Deeply experienced in manufacturing quality management and industrial data analytics (SPC, MSA, process capability analysis), integrating Minitab statistical algorithms with modern Web/Python engineering to build the BSA (Brumano Smart Analytics) product suite and plan enterprise data integration infrastructure.
    - Capable of both end-to-end B/S architecture and system integration as well as direct customer discovery, product demonstrations, technical proposals, cross-team delivery coordination, and cross-regional business collaboration.

