leadership:
  title_en: Leadership & Management
  title_zh: 研发团队管理与产品研发规划
  intro: 在 TECHMAX 任职期间承担5人研发团队的日常管理与跨部门推进职责，注重工程规范、版本节奏与业务交付结果的闭环。
  intro_en: Responsible for daily management of a 5-person R&D team and cross-functional alignment at TECHMAX, focusing on engineering standards, release cadence, and delivery outcomes.
  pillars:
    - title: 5人研发团队管理与协作
      title_en: 5-Person R&D Team Management
      desc: 负责团队日常管理、研发计划制定、任务拆解与分配、进度跟踪及代码与交付质量把控。
      desc_en: Managed daily team operations, R&D planning, task delegation, milestone tracking, and code/delivery quality.
    - title: 技术路线与架构评审
      title_en: Technical Roadmap & Architecture Reviews
      desc: 参与制定 B/S 架构与数据平台技术路线，组织关键技术方案评审，攻克研发及项目现场复杂技术问题。
      desc_en: Defined B/S and data platform roadmaps, led technical design reviews, and resolved complex engineering blockers.
    - title: 跨部门资源协同
      title_en: Cross-Functional Alignment
      desc: 联动产品、研发、销售与实施团队，平衡标准产品版本演进与重点客户项目交付节奏。
      desc_en: Coordinated product, R&D, sales, and implementation teams to balance product roadmap and client commitments.
    - title: 产品标准化与平台化沉淀
      title_en: Standardization & Platformization
      desc: 将服务约40家客户、约50个项目中的共性需求沉淀为可复用产品模块，提升整体交付效率与产品竞争力。
      desc_en: Abstracted common needs across approx. 40 clients and approx. 50 projects into reusable platform modules.

