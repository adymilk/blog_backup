work_experience:
  - company: TECHMAX
    company_en: TECHMAX
    period: 2019年至今
    period_en: 2019 – Present
    role: 高级系统架构师 / 解决方案工程师
    role_en: Senior Systems Architect / Solutions Engineer
    location: 上海
    location_en: Shanghai
    is_primary: true
    overview: 负责5人研发团队的日常管理与协作，参与产品技术路线规划、系统架构设计、工业软件产品规划及企业数字化解决方案落地；统筹协调产品、研发、销售与实施资源，推动从客户需求、产品迭代到项目交付与客户续约的全流程协同。具备国际化业务协作经验，长期与外籍管理者协作，并与香港、美国业务团队保持英文邮件沟通，能够独立处理日常英文商务及技术资料往来。
    overview_en: Manage day-to-day collaboration for a 5-person R&D team while driving product technical roadmaps, systems architecture, industrial software product planning, and enterprise digitalization delivery across product, R&D, sales, and implementation. Experienced in international business collaboration, working long-term with foreign management and maintaining regular English email communication with business teams in Hong Kong and the United States for routine commercial and technical matters.
    directions:
      - num: "01"
        title: 技术架构与研发管理
        title_en: Systems Architecture & R&D Management
        items:
          - 负责企业级软件产品的整体技术架构设计与技术路线规划。
          - 参与 B/S 架构产品的系统设计、技术选型和架构优化。
          - 负责前后端系统架构、数据库、缓存、接口服务及部署体系规划。
          - 带领5人研发团队，负责研发计划制定、任务分配、进度跟踪和质量管理。
          - 协调研发资源，推动产品标准化、模块化和平台化建设。
          - 参与技术方案评审，解决产品研发及项目实施中的关键技术问题，并持续优化研发协作与交付效率。
        items_en:
          - Led overall enterprise software architecture design and technical roadmap planning.
          - Participated in B/S system design, technology selection, and architecture optimization across frontend, backend, databases, caching, APIs, and deployment.
          - Managed a 5-person R&D team covering sprint planning, task allocation, progress tracking, and delivery quality.
          - Drove product standardization and modularization, participating in technical reviews and resolving critical engineering and implementation issues.
      - num: "02"
        title: 工业软件产品规划与管理
        title_en: Industrial Software Product Planning
        items:
          - 参与工业软件产品的整体规划、产品定位和功能体系设计。
          - 深入制造业质量管理场景，理解 SPC、MSA、过程能力分析等专业业务。
          - 负责产品需求调研、需求分析、产品功能规划和版本迭代。
          - 推动 BSA（Brumano Smart Analytics）智能数据分析平台建设，参与 BSA-SPC、BSA-MSA 等核心产品的规划与研发。
          - 推动 Minitab 统计分析算法与 Python 技术结合，实现专业统计分析能力的产品化。
          - 协调研发团队，将客户需求转化为可实施、可维护和可商业化的产品功能。
        items_en:
          - Contributed to industrial software product strategy, positioning, and functional architecture for manufacturing quality management (SPC, MSA, process capability).
          - Owned requirements discovery, analysis, feature design, and release iteration planning.
          - Helped build the BSA (Brumano Smart Analytics) platform, including planning and R&D for BSA-SPC and BSA-MSA.
          - Productized Minitab statistical algorithms integrated with Python engineering workflows.
      - num: "03"
        title: 企业数字化解决方案
        title_en: Enterprise Digitalization Solutions
        items:
          - 面向制造业客户提供质量管理数字化及生产数据分析整体解决方案。
          - 负责客户业务场景调研、需求分析和解决方案设计，规划 SPC 实时监控、质量数据分析及测量系统分析等场景。
          - 参与 MES、ERP、SQL Server、MySQL 等系统的数据集成与接口对接。
          - 参与企业数据采集、ETL、数据治理及统一数据模型架构规划。
          - 结合客户现有 IT 环境制定可落地的系统部署及集成方案，推动传统质量管理向数据化、自动化和智能化升级。
        items_en:
          - Designed end-to-end quality digitalization and production analytics solutions for manufacturing clients (real-time SPC monitoring, quality analytics, MSA).
          - Participated in data integration and interface connectivity with MES, ERP, SQL Server, and MySQL environments.
          - Contributed to enterprise data acquisition, ETL, governance, and unified data model planning tailored to client IT landscapes.
      - num: "04"
        title: 售前咨询与客户交付
        title_en: Pre-Sales Consulting & Client Delivery
        items:
          - 参与重点客户售前技术交流、需求调研和业务分析。
          - 负责产品演示、技术方案设计、项目方案汇报及技术答疑。
          - 将客户需求转化为产品功能、技术方案和项目实施计划。
          - 参与项目实施、系统部署、客户培训、产品使用指导及售后技术支持。
          - 协调研发、销售、实施及客户团队推动项目交付，并参与客户续约、产品升级与持续服务。
          - 具备国际化业务协作经验，长期与外籍管理者协作，并与香港、美国业务团队保持英文邮件沟通，独立处理日常英文商务及技术资料往来。
        items_en:
          - Supported key-account pre-sales discussions, product demos, technical solution proposals, and executive presentations.
          - Participated in deployment, customer training, technical support, renewals, and product upgrades across R&D, sales, and implementation teams.
          - Collaborated closely with foreign management and maintained regular English business email correspondence with Hong Kong and US teams for commercial and technical documentation.
      - num: "05"
        title: 产品商业化与业务成果
        title_en: Product Commercialization & Business Impact
        items:
          - 参与工业软件产品的市场推广与商业化落地，产品累计服务客户约40家、累计参与项目约50个。
          - 通过客户需求分析、产品演示与商务技术交流，支持销售团队推动项目机会转化。
          - 参与项目实施及交付，推动产品在制造业客户现场实际落地。
          - 参与已有客户的产品升级、续约及客户关系维护，促进长期合作。
          - 将项目中的共性需求沉淀为标准化产品能力，通过持续迭代提升客户使用价值与产品竞争力。
        items_en:
          - Contributed to market adoption and commercialization of industrial software serving approx. 40 clients across approx. 50 projects.
          - Supported sales conversion through requirements discovery, product demos, and technical proposals.
          - Consolidated recurring client needs into reusable standard product capabilities while supporting renewals and upgrades.
      - num: "06"
        title: AI 与技术创新
        title_en: AI & Technical Innovation
        items:
          - 围绕企业级 AI 应用规划、AI Agent 与智能工作流、AI 数据治理与智能分析方向开展持续探索。
          - 探索工业软件与 AI 技术融合，包括智能统计分析、自动化报告生成、企业知识库及智能业务应用。
          - 重点参与规划 BSA Data Hub 企业数据集成与智能数据处理平台，探索多源数据接入、数据标准化、ETL 自动化、统一测量事件模型及多分析引擎协同。
        items_en:
          - Explored enterprise AI planning, AI Agents, automated workflows, AI-assisted data governance, automated reporting, and enterprise knowledge bases.
          - Participated in planning BSA Data Hub for multi-source industrial data ingestion, ETL automation, unified measurement event modeling, and multi-engine analytics.

