  intro:
    - 专注工业软件、智能制造与企业数字化领域，具备从软件开发、系统架构、5人研发团队管理到产品规划、解决方案设计和客户交付的复合型经验。
    - 长期参与工业质量分析软件及企业数据平台建设，参与服务约40家客户、约50个项目，持续推动技术能力向产品价值和商业成果转化。
