philosophy:
  quote_zh: 技术本身不是目的，能够深入产业现场、经受真实业务检验并创造商业回报的产品，才具有长期生命力。
  quote_en: Technology is a means, not an end. Lasting value comes from products tested in real industrial workflows that deliver measurable commercial return.
  principles:
    - title_zh: 深入现场，从业务痛点出发
      title_en: Start from the shop floor and real pain points
      desc_zh: 避免在没有理清业务边界前堆砌技术框架，先定义问题与成功指标。
      desc_en: Define business boundaries and success metrics before choosing technical stacks.
    - title_zh: 架构服务于产品与交付
      title_en: Architecture serves product & delivery
      desc_zh: 好的系统设计不仅追求优雅，更要考虑客户环境约束、可运维性与交付成本。
      desc_en: Good architecture balances elegance with deployment constraints, reliability, and total cost of ownership.
    - title_zh: 用 AI 重塑传统产业工作流
      title_en: Reshaping traditional workflows with AI
      desc_zh: 关注 AI Agent 与数据智能在制造业等传统行业中的高价值切入点与商业机会。
      desc_en: Exploring high-ROI applications of AI Agents and data intelligence in manufacturing and enterprise workflows.

