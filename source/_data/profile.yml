# ---------------------------------------------------------------- 旗舰项目索引
# 与 /works/ 页呼应。
#
# evidence_level 是最重要的字段（引自 FDE 作品集调研）：
#   L0 声称      — "系统很稳定"，无测量方法。不能算证据，不要写。
#   L1 展示      — 截图、架构图、一次成功演示
#   L2 可复现    — 有数据、命令、版本、预期输出，别人能重跑 ← 旗舰项目核心链路至少到这
#   L3 经使用验证 — 有真实试点用户、基线、结果与限制
#
# ⚠️ status 若非真实客户，必须写「模拟企业场景」。诚实标注反而加分 ——
#    可信度比规模重要。
projects:
  - name: Minitab COM 桥接服务
    status: ""            # TODO(James): 生产中 / 已交付 / 模拟企业场景
    evidence_level: L1    # TODO(James): 目标至少 L2
    domain: 工业质量分析
    stack: []             # TODO(James): ["C#", ".NET", "Minitab COM", "HTTP 轮询"]
    url: "/2020/07/14/数据科学/"
    case_anchor: ""       # TODO(James): resume 页里对应案例的锚点

  - name: Minitab 二次开发实时生成控制图
