# ---------------------------------------------------------------- 填写说明
# 这个字段不会被页面渲染，保留在文件里是为了新增案例时不跑偏。
case_template:
  fields:
    - 场景
    - 模糊点
    - 边界(in/out scope)
    - 关键决策(≥2 个备选 + 各自代价)
    - 交付节奏
    - 结果(对比基线)
    - 运营与交接
    - 复盘
  note: 案例正文写在 source/resume/index.md，不要写在这里。
